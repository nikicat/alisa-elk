name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true

      - name: Install Python 3.14
        run: uv python install 3.14

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (pyright)
        run: uv run pyright app/

      - name: Run tests
        run: uv run pytest -q

      - name: Verify migrations apply on empty DB
        env:
          DB_URL: sqlite:///./_ci.db
        run: uv run alembic upgrade head

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: alisa-elk:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: |
          docker run -d --name elk \
            -e DB_URL=sqlite:////tmp/ci.db \
            -p 8080:8080 \
            alisa-elk:ci

      - name: Wait for HEALTHCHECK to report healthy
        run: |
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' elk 2>/dev/null || echo "missing")
            echo "attempt $i: $status"
            case "$status" in
              healthy) exit 0 ;;
              unhealthy) echo "container went unhealthy"; exit 1 ;;
            esac
            sleep 1
          done
          echo "timed out waiting for healthy"
          exit 1

      - name: Dump container logs on failure
        if: failure()
        run: docker logs elk || true
